<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-02 Quét mã QR ụ khoá</title>
<style>
  body { margin: 0; background: #F2F2F2; font-family: system-ui, sans-serif; color: #1A1A1A; }
  .phone { width: 360px; min-height: 640px; margin: 16px auto; background: #FFFFFF; display: flex; flex-direction: column; }
  header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; border-bottom: 1px solid #D0D0D0; }
  header h1 { font-size: 20px; margin: 0; }
  .icon-btn { width: 48px; height: 48px; border: none; background: none; font-size: 22px; color: #0B5FA5; }
  .icon-btn:focus-visible { outline: 2px solid #0B5FA5; }
  main { padding: 16px; flex: 1; }
  .guide { font-size: 16px; margin: 0 0 16px; }
  .camera { height: 320px; background: #3A3A3A; display: flex; align-items: center; justify-content: center; }
  .target { width: 160px; height: 160px; border: 3px solid #FFFFFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .hold { margin-top: 16px; font-size: 16px; }
  .hold strong { color: #0B5FA5; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <button class="icon-btn" type="button" aria-label="Quay lại">&lt;</button>
    <h1>Thuê xe</h1>
    <button class="icon-btn" type="button" aria-label="Trợ giúp">?</button>
  </header>
  <main>
    <p class="guide" id="guide">Hướng camera vào mã QR dán trên ụ khoá.</p>
    <div class="camera" role="img" aria-label="Khung camera quét mã QR ụ khoá" aria-describedby="guide">
      <div class="target">vùng QR</div>
    </div>
    <p class="hold">Khi quét, hệ thống tạm giữ <strong>200.000 đ</strong> trên thẻ đã liên kết.</p>
    <div role="status" aria-live="polite"></div>
  </main>
</div>
</body>
</html>
